<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哇鸥 · 去大坝整点饵块</title>
    <!-- 加到主屏幕之后是全屏横屏的一个 app,**地址栏整个没有** ——
         浏览器里那条地址栏在手机横屏下要吃掉三分之一的高度,
         而高度每省 1px 画面就宽 2px(见下面 --stage-max-w 的算法)。
         manifest 里 orientation: landscape 顺带把方向也锁了。 -->
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#1d5f76">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="css/pixel-tokens.css">
    <link rel="stylesheet" href="css/pixel-base.css">
    <link rel="stylesheet" href="css/pixel-icons.css">
    <link rel="stylesheet" href="css/pixel-ui.css">
    <style>
        body { display: block; padding: 20px 12px 40px; }
        /* 按钮栏不再占位置(它们压在画面上了),所以这儿就是画面本身的宽度。
           1896 = 1860 的画面 + 14px 内衬 ×2 + 4px 描边 ×2。 */
        .wrap { width: min(1896px, 100%); margin-inline: auto; }
        .title { text-align: center; margin-bottom: 16px; }
        .title h1 { font-size: 32px; }

        /* **画面还得被视口高度夹住。** 这是个横屏游戏,画面比 2:1 ——
           只按宽度算的话,笔记本上画面会长过一屏,底下那条按钮栏要滚才看得到,
           而它是主要的导航。
           反解:舞台高 = (舞台宽 − 28) × 938/1868 + 28,所以
           舞台宽 = (可用高 − 28) × 1.9915 + 28。--chrome 是画面之外那些东西
           (标题、状态条、内衬、底下那道厚边)占掉的高度。 */
        /* 状态条也压进画面之后,画面之外就只剩标题和内衬了 */
        :root { --chrome: 118px; }
        /**
         * **svh,不是 dvh,更不是 vh。**
         *
         * dvh 是「动态视口高度」—— 手机浏览器的地址栏一收一放它就变,
         * 于是玩家上下一划,整个画面跟着放大缩小。那不是 bug,
         * 是 dvh 的定义,只不过我们要的正好是反面。
         * vh 在手机上等于「地址栏收起时」的高度,地址栏在的时候会溢出、
         * 出滚动条 —— 一滚地址栏又收,又变。
         * **svh 是「视口最小的时候有多高」** —— 地址栏在也好收了也好,
         * 这个数不变,画面就不会动。
         *
         * 先写 vh 兜底(老浏览器三个新单位都不认),
         * 再在 @supports 里换成 svh。
         */
        .px-console { --stage-max-w: calc((100vh - var(--chrome) - 28px) * 1.9915 + 28px); }
        /* 待机界面铺满整屏,它的舞台也得被高度夹住 —— 不夹的话
           笔记本上万达双塔和「开始游戏」都会掉到屏幕外面去 */
        .title-screen { --stage-max-w: calc((100vh - 60px) * 1.9915 + 28px); }
        @supports (height: 1svh) {
            .px-console { --stage-max-w: calc((100svh - var(--chrome) - 28px) * 1.9915 + 28px); }
            .title-screen { --stage-max-w: calc((100svh - 60px) * 1.9915 + 28px); }
        }

        /* 窄屏 / 矮屏:标题和状态条都收一收,把高度全让给画面。
           画面本身不用管 —— 真机 DPR 2~3 下 1860 的位图落在 780~2550 个
           设备像素上,是上采样或者很轻的下采样,看着是干净的。 */
        @media (max-width: 700px) {
            body { padding: 10px 6px 24px; }
            .title { margin-bottom: 8px; }
            .title h1 { font-size: 20px; }
        }
        /* 手机横过来之后视口就剩三四百高。**标题让位** ——
           它每局只读一次,而画面是一直在看的 */
        /* 手机横过来之后视口只剩两三百高,而画面是 2:1 的 ——
           高度每省下 1px,宽度就能多出 2px。所以这一档把画面之外的东西
           压到最少:标题不要、内衬收到 6px、页面留白收到 4px。 */
        @media (max-height: 560px) {
            :root { --chrome: 16px; }
            body { padding: 3px 3px 4px; }
            .title { display: none; }
            .px-console { margin-bottom: 0; }
            .px-stage { padding: 6px; }
            /* 内衬变了,反解那条也得跟着变:6×2 = 12,不是 14×2 = 28 */
            .px-console { --stage-max-w: calc((100vh - var(--chrome) - 12px) * 1.9915 + 12px); }
            /* 横屏时整页**不许滚**。没得滚,地址栏就不会收放,
               画面也就不会跟着一惊一乍 —— 这是上面那条 svh 的另一半 */
            html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
        }
        @supports (height: 1svh) {
            @media (max-height: 560px) {
                .px-console { --stage-max-w: calc((100svh - var(--chrome) - 12px) * 1.9915 + 12px); }
            }
        }

        /* ---------- 竖屏:请把手机横过来 ----------
           这是个横着玩的游戏(画面 2:1,大坝本来就是长的)。
           竖屏硬塞的话画面只能缩到手指盖大小,不如直接请玩家转一下。
           `screen.orientation.lock()` 只在全屏里有效、而且 iOS 不支持,
           所以**不锁,只提示** —— 提示是所有浏览器都吃的那条路。 */
        .rotate { display: none; }
        @media (orientation: portrait) and (max-width: 900px) {
            .rotate {
                position: fixed; inset: 0; z-index: 300;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 20px;
                padding: 24px; text-align: center;
                background: var(--sea-ink);
                color: var(--foam);
                font-family: var(--font-pixel);
            }
            /* 竖屏时把底下的东西整个停掉,免得 canvas 在背后空转 */
            body > .wrap, body > .title-screen { display: none; }
        }
        .rotate__phone {
            width: 58px; height: 96px;
            box-shadow: 0 0 0 4px var(--foam), inset 0 0 0 4px var(--sea-ink);
            background: var(--sea);
            animation: rot 2.4s ease-in-out infinite;
        }
        .rotate h2 { font-size: 22px; margin: 0; }
        .rotate p { margin: 0; font-size: 14px; opacity: .75; max-width: 20em; line-height: 1.8; }
        @keyframes rot {
            0%, 30% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(-90deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .rotate__phone { animation: none; transform: rotate(-90deg); }
        }
        /* 这儿原来有一条 `#panel { min-height: 320px }` —— 上一版布局留的,
           那时候抽屉是往下接的一长条,给个下限免得它空着太薄。
           **它是这次「内容漏出抽屉」的真正原因**:pixel-ui.css 里给
           .px-drawer__body 写的 `min-height: 0` 是类选择器,
           被这条 id 选择器压得死死的,于是 overflow 永远不生效。
           查了两轮才找到 —— 因为两边都写着 min-height,看着像是已经处理过了。 */
        /* 飞行覆盖层铺满舞台 */
        /* z-50:**要盖住那三条按钮栏**(z-40)。飞的时候按钮栏该整个消失,
           不然一屏上会有两套操作 —— 而且觅食那两个圆键就在同样的位置 */
        #flyOverlay { position: absolute; inset: 0; z-index: 50; display: none; }
        #flyOverlay.is-open { display: block; }
        #flyCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        /* 手机上必须写这两行,否则飞行玩法根本没法玩:
           哇鸥是靠 pointermove 拖着走的,而**默认情况下浏览器会把手指的
           纵向拖动当成滚页面**,直接给你发一个 pointercancel 就没了。
           touch-action:none 是告诉浏览器「这块的手势归我」。
           overscroll-behavior 挡的是拖到边缘时触发的下拉刷新。 */
        #flyOverlay, #flyCanvas {
            touch-action: none;
            overscroll-behavior: contain;
        }
        /* 状态条让开右上角那两个小按钮,窄屏上自己换行 */
        .fly-hud {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 25;
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 6px; pointer-events: none;
        }
        /**
         * 飞行时的状态条**不要实心底**。
         *
         * 大坝那条状态条是有底色的(读数需要一块安静的底,见 pixel-ui.css)——
         * 但那是压在一张不动的画上。飞行这一场画面是**动的**,
         * 一排深色方块横在天上,东西从它后面钻出来,玩家看见的时候已经晚了。
         * 所以这一条反过来:去掉底色,靠描边读。
         * (生成区也一并从这一条底下让开,见 flight.js 的 SPAWN_TOP。)
         */
        .fly-hud .px-chip {
            font-size: 13px; padding: 2px 6px; gap: 5px;
            background: none;
            box-shadow: none;
            color: var(--foam);
            text-shadow:
                -1px -1px 0 var(--ink),  0 -1px 0 var(--ink),  1px -1px 0 var(--ink),
                -1px  0   0 var(--ink),                        1px  0   0 var(--ink),
                -1px  1px 0 var(--ink),  0  1px 0 var(--ink),  1px  1px 0 var(--ink);
        }
        /* 暂停/收工保留底色 —— 它们是按钮,得看得出能点 */
        .fly-ctrl .px-btn { text-shadow: none; }
        .fly-hud .px-icon { width: 13px; height: 13px; }
        .fly-ctrl {
            margin-left: auto;              /* 顶到最右,和 chip 挤不到一起 */
            display: flex; gap: 6px;
            pointer-events: auto;           /* 状态条是 none,这两个要能点 */
        }
        .fly-ctrl .px-btn { font-size: 12px; padding: 6px 10px; }
        /* 两个键。**左边的键放画面左下,右边的键放右下** ——
           一个手一个,和键盘上空格在左、方向键在右是同一套位置关系。
           挤在同一边的话,一只手要横着够两个,而平飞是要一直按住的。

           做成圆的、做得大,都是为了手机:一个 88px 的圆才是拇指点得中的。
           **但像素画里没有真圆** —— 用 border-radius 会出一圈抗锯齿的灰边,
           整张画面里就这两个地方是糊的。所以 clip-path 走的是
           16×16 像素圆的那条阶梯轮廓:边缘全是直角,放大多少倍都不糊。
           (和画布上 plate() 用切角方块当「圆」是同一个道理。) */
        .fly-key {
            /* **直径必须是 16 的整数倍。** 阶梯轮廓是按 16 格算的,
               96/16 = 6 —— 每一级正好 6 个 CSS 像素,边缘落在整数上不会糊。
               88 的话每级 5.5px,浏览器会给每一级抹一道抗锯齿的灰。
               里面那圈同理:缩 8px 之后是 80,80/16 = 5,还是整数。 */
            --d: 96px;
            --ring: 8px;
            position: absolute; bottom: 18px; z-index: 25;
            width: var(--d); height: var(--d); padding: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px;
            border: none; background: var(--ink); cursor: pointer;
            font-family: var(--font-pixel); color: var(--ink); line-height: 1;
            clip-path: polygon(
                68.75% 0%, 68.75% 6.25%, 81.25% 6.25%, 81.25% 12.5%, 87.5% 12.5%,
                87.5% 18.75%, 93.75% 18.75%, 93.75% 31.25%, 100% 31.25%, 100% 68.75%,
                93.75% 68.75%, 93.75% 81.25%, 87.5% 81.25%, 87.5% 87.5%, 81.25% 87.5%,
                81.25% 93.75%, 68.75% 93.75%, 68.75% 100%, 31.25% 100%, 31.25% 93.75%,
                18.75% 93.75%, 18.75% 87.5%, 12.5% 87.5%, 12.5% 81.25%, 6.25% 81.25%,
                6.25% 68.75%, 0% 68.75%, 0% 31.25%, 6.25% 31.25%, 6.25% 18.75%,
                12.5% 18.75%, 12.5% 12.5%, 18.75% 12.5%, 18.75% 6.25%, 31.25% 6.25%,
                31.25% 0%);
            /* 厚底。**不能用 box-shadow** —— clip-path 会把它一起剪掉;
               drop-shadow 是跟着剪完的形状走的,所以圆边下面才有那一道厚 */
            filter: drop-shadow(0 6px 0 var(--ink));
            /* 连点几十下的东西,别让它选中文字、别触发双击缩放 */
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }
        /* 里面那块金色。父元素是描边色,这一层往里缩一圈就是那道边。
           **明暗用 linear-gradient 不用 inset box-shadow** ——
           inset 阴影是贴着方盒子画的,剪成圆之后就成了顶上一道平盖、
           底下一道平托,像给硬币扣了个盒盖;渐变是先铺满再一起剪,
           亮暗跟着圆边走,才像个球。 */
        .fly-key::before {
            content: ''; position: absolute; inset: var(--ring);
            clip-path: inherit;
            background: linear-gradient(
                var(--gold-l) 0 14%, var(--gold) 14% 78%, var(--gold-d) 78% 100%);
        }
        .fly-key > * { position: relative; z-index: 1; }
        .fly-key:hover { filter: drop-shadow(0 6px 0 var(--ink)) brightness(1.08); }
        .fly-key:active {
            transform: translateY(6px);
            filter: none;
        }
        .fly-key--l { left: 18px; }
        .fly-key--r { right: 18px; }
        .fly-key kbd { font: inherit; font-size: 13px; opacity: .6; }
        .fly-key b { font-weight: normal; font-size: 20px; }
        @media (max-width: 560px) {
            .fly-key { --d: 64px; }
            .fly-key kbd { font-size: 10px; }
            .fly-key b { font-size: 13px; }
            .fly-hud .px-chip { padding: 3px 7px; font-size: 11px; gap: 4px; }
            .fly-hud .px-icon { width: 11px; height: 11px; }
            .fly-ctrl .px-btn { padding: 5px 8px; font-size: 11px; }
        }
        /**
         * 手机横过来是「宽而矮」—— **只判宽度的话这一档永远不会触发**。
         * 视口八百多宽,而画面被高度夹住之后只有四百来宽,
         * 96px 的圆键在上面就是两块大饼,把能飞的地方盖掉一大片。
         * (真机截图里就是这样。和前面栏那次是同一个毛病:
         *  视口的宽度不等于画面的宽度。)
         */
        @media (max-height: 620px) {
            .fly-key { --d: 64px; }
            .fly-key kbd { font-size: 10px; }
            .fly-key b { font-size: 13px; }
            .fly-hud { top: 6px; left: 6px; right: 6px; gap: 4px; }
            .fly-hud .px-chip { padding: 3px 6px; font-size: 11px; gap: 4px; }
            .fly-hud .px-icon { width: 11px; height: 11px; }
            .fly-ctrl .px-btn { padding: 4px 7px; font-size: 11px; }
        }
        /**
         * 支持容器查询就按**画面自己的宽度**分档 —— 这才是真正想问的那个数。
         * 直径只在 {48, 64, 80, 96} 里挑:配上 8px 的圈,里外都是 16 的整数倍,
         * 阶梯轮廓才不会被抹一圈灰(见上面 --d 那条注释)。
         */
        @supports (width: 1cqi) {
            @container (max-width: 900px) { .fly-key { --d: 80px; } }
            @container (max-width: 660px) {
                .fly-key { --d: 64px; }
                .fly-key kbd { font-size: 10px; }
                .fly-key b { font-size: 13px; }
            }
            @container (max-width: 480px) {
                .fly-key { --d: 48px; --ring: 8px; }
                .fly-key kbd { display: none; }
                .fly-key b { font-size: 12px; }
            }
        }
        /* 开局那三秒的数字。压在画面正中,不吃点击 —— 这三秒里
           两个键是通的,数字挡住按钮就白给了 */
        .fly-count {
            position: absolute; inset: 0; z-index: 26;
            display: flex; align-items: center; justify-content: center;
            font-size: 96px; line-height: 1;
            color: var(--gold, #f5b83d);
            text-shadow: 4px 4px 0 rgba(36, 26, 19, .85);
            pointer-events: none;
        }
        @media (max-width: 560px), (max-height: 620px) { .fly-count { font-size: 56px; } }

        /* 待机界面 */
        .title-screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            background: var(--sea-ink);
        }
        .title-screen.is-gone { display: none; }
        .title-screen__plate {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            /* 标题放天上、按钮放城市下面那条带上 ——
               都挤在正中的话会正好压住万达双塔,那是整张图的地标。 */
            padding: 7% 0 22%;
            pointer-events: none;
        }
        .title-screen__plate h1 { font-size: 34px; text-align: center; }
        .title-screen__plate .px-btn { pointer-events: auto; }
        #toast {
            position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
            z-index: 80; display: none;
        }
        #toast.is-open { display: inline-block; }
    </style>
</head>
<body>

<!-- 竖屏时盖住整页。纯 CSS 判定,没有 JS —— 转回横屏它自己就没了 -->
<div class="rotate">
    <div class="rotate__phone"></div>
    <h2>把手机横过来</h2>
    <p>海埂大坝是长的,这个游戏也是。</p>
</div>

<!-- 待机界面。盖住整页,点「开始游戏」才进去 -->
<div id="title" class="title-screen">
    <div class="px-stage">
        <div class="px-screen">
            <canvas id="titleCanvas" width="1860" height="930"></canvas>
            <div class="title-screen__plate">
                <h1>哇鸥 · 去大坝整点饵块</h1>
                <button class="px-btn px-btn--lg" id="startBtn">开始游戏</button>
            </div>
        </div>
    </div>
</div>

<div class="wrap">

    <div class="title">
        <h1>哇鸥 · 去大坝整点饵块</h1>
    </div>

    <!-- 机身:画面铺满,功能按钮**压在画面四周**、底色全透明。
         点一个按钮,内容以抽屉的形式压在画面上 —— **画面始终在那儿**。

         按钮栏原来是占位置的:左右各一条竖的、底下一条横的。桌面上无所谓,
         **手机上左右两条加起来吃掉四成宽**,而这本质是个手机游戏。 -->
    <div class="px-console" id="console">
        <div class="px-stage">
        <div class="px-screen">
            <canvas id="bgCanvas" width="1860" height="930"></canvas>

            <!-- 四条栏。**全在 .px-screen 里面** —— 放外面的话定位要跟着
                 木框的内衬走,而内衬在窄屏上会变;放里面就是贴着画面本身的
                 四条边,一劳永逸。上面那条是状态(钱/天/等级/经验),
                 另外三条是按钮。底色全透明,只靠字的描边读。 -->
            <div id="hud" class="px-rail px-rail--t"></div>
            <div id="railLeft" class="px-rail px-rail--v"></div>
            <div id="railRight" class="px-rail px-rail--v"></div>
            <div id="railBottom" class="px-rail px-rail--h"></div>

            <div id="flyOverlay">
                <canvas id="flyCanvas" width="1860" height="930"></canvas>
                <div class="fly-hud">
                    <span class="px-chip px-chip--dark">
                        <i class="px-icon px-icon--erkuai"></i> <strong id="flyScore">0</strong>
                        <span id="flyCombo" style="color:var(--gold)"></span>
                    </span>
                    <span class="px-chip px-chip--dark">
                        <i class="px-icon px-icon--heart"></i> <span id="flyLives">3</span>
                    </span>
                    <!-- 第几波。20 秒一波,越往后越快越密 -->
                    <span class="px-chip px-chip--dark">
                        <i class="px-icon px-icon--star"></i> 第 <strong id="flyWave">1</strong> 波
                    </span>
                    <span class="px-chip px-chip--dark">
                        <i class="px-icon px-icon--map"></i> <strong id="flyDist">0</strong> 米
                    </span>
                    <!-- 道具:四样共用一格,都在倒数。**各占一个 chip 的话,
                         拿到两个就把「第几波」挤出屏幕了**,而它们本来是同一类东西 -->
                    <span class="px-chip px-chip--dark" id="flyBuffs" hidden
                          style="color:var(--gold)"></span>
                    <!-- 招了丫丫才出现:她隔一阵替你挡一下,得让人知道现在有没有 -->
                    <span class="px-chip px-chip--dark" id="flyYaya" hidden>
                        <i class="px-icon px-icon--crew_yaya"></i>
                        <span id="flyYayaText">护着</span>
                    </span>
                    <!-- 五分钟之后才出现。肚子条本身画在画布上 -->
                    <span class="px-chip px-chip--dark" id="flyHungry" hidden
                          style="color:var(--coral)">
                        <i class="px-icon px-icon--erkuai"></i> 饿了!快吃
                    </span>
                    <!-- 暂停/收工**放在同一行里**,不是另开一个绝对定位的角。
                         原来它们各占一个角,状态条靠 `right: 128px` 手动躲开 ——
                         而那个 128 是照桌面量的,手机上按钮和 chip 都是另一个尺寸,
                         「第 1 波」就钻到「暂停」底下去了。
                         同一行 + margin-left:auto,**它们从结构上就不可能重叠**。 -->
                    <div class="fly-ctrl">
                        <button class="px-btn px-btn--sm" id="flyPause">⏸ 暂停</button>
                        <button class="px-btn px-btn--sm px-btn--coral" id="flyQuit">收工</button>
                    </div>
                </div>
                <button class="fly-key fly-key--l" id="flyFlap"><kbd>空格</kbd><b id="flyFlapText">跃起</b></button>
                <button class="fly-key fly-key--r" id="flyGlide"><kbd>→</kbd><b>平飞</b></button>
                <div class="fly-count" id="flyCount" hidden></div>
                <div class="px-mask" id="pauseMask">
                    <h2>暂停</h2>
                    <button class="px-btn" id="flyResume">▶ 继续</button>
                </div>
            </div>

            <!-- 抽屉:压在画面上,**不铺满** —— 露出来的那一截就是「码头还在」 -->
            <div id="drawer" class="px-drawer" hidden>
                <div class="px-drawer__bar">
                    <strong id="drawerTitle"></strong>
                    <button class="px-btn px-btn--sm px-btn--coral" id="drawerClose">收起</button>
                </div>
                <div id="panel" class="px-drawer__body"></div>
                <!-- 翻页。**一屏装不下就翻页,不上下滑** ——
                     手机横过来抽屉只有两百来高,滑动的内容看不见头也看不见尾,
                     玩家不知道自己在第几段、还有多少。分页至少把「还有几页」
                     写在那儿。 -->
                <div id="pager" class="px-pager" hidden>
                    <button class="px-btn px-btn--sm" data-act="pageprev">‹ 上一页</button>
                    <span class="px-pager__n"></span>
                    <button class="px-btn px-btn--sm" data-act="pagenext">下一页 ›</button>
                </div>
            </div>

            <!-- 出摊的厨房。**它是 DOM 不是画布** —— 核心动作是把食材拖到厨具上,
                 拖拽、命中判定、拖影这些浏览器本来就有,没必要在 canvas 上重造一遍。 -->
            <div id="kitchen" class="px-kitchen" hidden></div>

            <!-- 整页场景的操作条(小屋 / 出摊)。压在画面底下,不占画面外的地方 -->
            <div id="sceneBar" class="px-scenebar" hidden></div>

            <!-- 新手引导。**压在画面上,不在抽屉里面** ——
                 原来它是抽屉内容的第一块,一条四行的说明就吃掉抽屉一半的高度,
                 而抽屉本来是用来看背包和摊子的。它是「贴在屏幕上的一张便签」,
                 不是某一页的内容。 -->
            <div id="coach" class="px-coach" hidden></div>

            <!-- 场景里的弹窗:占卜、下棋、请喝都在这儿开 -->
            <div id="modal" class="px-modal" hidden>
                <div class="px-modal__box">
                    <div class="px-modal__bar">
                        <strong id="modalTitle"></strong>
                        <button class="px-btn px-btn--sm px-btn--coral" id="modalClose">关掉</button>
                    </div>
                    <div id="modalBody" class="px-modal__body"></div>
                </div>
            </div>
        </div>
        </div>
    </div>

</div>

<div id="toast" class="px-toast"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
